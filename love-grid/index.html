<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我們的愛戀九宮格</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-50:#fff5f8; --pink-100:#ffe4ee; --pink-200:#ffc9dc; --pink-300:#ff9fc0;
    --pink-400:#f777a3; --pink-500:#e8578a; --rose:#c93d6e; --ink:#6b2c45; --muted:#a8728a;
    --lilac:#e9dcff; --peach:#ffe3d3;
    --radius:22px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:"Huninn","Noto Sans TC",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 10% -10%, var(--lilac) 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 10%, var(--peach) 0%, transparent 55%),
      linear-gradient(180deg, var(--pink-50), var(--pink-100));
    min-height:100vh;
    overflow-x:hidden;
  }
  /* floating hearts */
  .hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .hearts span{
    position:absolute;bottom:-40px;color:var(--pink-300);opacity:.0;
    animation:floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{transform:translateY(0) rotate(0deg) scale(.8);opacity:0}
    10%{opacity:.7}
    100%{transform:translateY(-110vh) rotate(25deg) scale(1.1);opacity:0}
  }

  main{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:40px 20px 56px}
  header{text-align:center;margin-bottom:28px}
  .script{font-family:"Dancing Script",cursive;color:var(--pink-500);font-size:28px;letter-spacing:.5px;margin:0}
  h1{margin:4px 0 10px;font-size:clamp(26px,6vw,36px);font-weight:700;letter-spacing:2px;color:var(--rose)}
  h1 .h{display:inline-block;animation:beat 1.6s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
  .sub{color:var(--muted);font-size:15px;margin:0}

  .card{
    background:rgba(255,255,255,.65);
    backdrop-filter:blur(10px);
    border:2px solid #fff;
    border-radius:32px;
    padding:18px;
    box-shadow:0 20px 50px -20px rgba(201,61,110,.35), inset 0 0 0 1px var(--pink-100);
  }
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .cell{
    position:relative;aspect-ratio:1/1;border:none;cursor:pointer;
    border-radius:var(--radius);
    background:linear-gradient(145deg,#fff, var(--pink-50));
    box-shadow:0 6px 0 var(--pink-200), 0 10px 20px -8px rgba(232,87,138,.35);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    padding:10px;font-family:inherit;color:var(--ink);
    transition:transform .18s ease, box-shadow .18s ease, background .3s ease;
    overflow:hidden;
  }
  .cell:hover{transform:translateY(-3px);box-shadow:0 9px 0 var(--pink-200),0 16px 26px -10px rgba(232,87,138,.45)}
  .cell:active{transform:translateY(3px);box-shadow:0 3px 0 var(--pink-200),0 6px 12px -6px rgba(232,87,138,.35)}
  .cell:focus-visible{outline:3px solid var(--pink-400);outline-offset:3px}
  .cell .num{
    position:absolute;top:8px;left:10px;font-family:"Dancing Script",cursive;
    font-size:18px;color:var(--pink-300)
  }
  .cell .icon{font-size:26px;line-height:1;transition:transform .3s}
  .cell .place{font-size:clamp(13px,3.6vw,17px);font-weight:500;text-align:center;line-height:1.3;
    word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .cell.empty .icon{color:var(--pink-300);font-size:30px}
  .cell.empty .place{color:var(--muted);font-size:13px;font-weight:400}
  .cell.filled{background:linear-gradient(145deg,#ffe9f1,#ffd3e3)}
  .cell.filled .icon{color:var(--pink-500)}
  .cell.visited{background:linear-gradient(145deg,#fff1d9,#ffd9c7)}
  .cell .stamp{
    position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;
    background:linear-gradient(145deg,var(--pink-400),var(--rose));color:#fff;font-size:14px;
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px -4px rgba(201,61,110,.8);
    transform:rotate(-12deg)
  }
  .cell .date{font-size:11px;color:var(--rose);background:rgba(255,255,255,.7);border-radius:999px;padding:2px 8px;margin-top:2px}
  .cell.saving{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.6}}
  .cell.pop .icon{animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}

  .status{
    margin:18px auto 0;text-align:center;font-size:13px;color:var(--muted);min-height:20px;
    display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap
  }
  .status .dot{width:8px;height:8px;border-radius:50%;background:var(--pink-300)}
  .status.ok .dot{background:#7ccf9b}
  .status.err{color:var(--rose)}
  .status.err .dot{background:var(--rose)}
  .linkbtn{background:none;border:none;color:var(--pink-500);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
  .footer-note{margin-top:22px;text-align:center;font-size:12px;color:var(--muted)}
  .footer-note a{color:var(--pink-500)}

  /* modal */
  .backdrop{
    position:fixed;inset:0;z-index:10;background:rgba(107,44,69,.25);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;padding:20px
  }
  .backdrop.open{display:flex;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{
    width:100%;max-width:380px;background:#fff;border-radius:28px;padding:26px 22px 20px;
    box-shadow:0 30px 60px -20px rgba(201,61,110,.5);position:relative;
    animation:rise .28s cubic-bezier(.2,.9,.3,1.3)
  }
  @keyframes rise{from{transform:translateY(20px) scale(.95);opacity:0}to{transform:none;opacity:1}}
  .modal::before{
    content:"♥";position:absolute;top:-22px;left:50%;transform:translateX(-50%);
    width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,var(--pink-300),var(--pink-500));
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;
    box-shadow:0 8px 18px -6px rgba(232,87,138,.7)
  }
  .modal h2{margin:6px 0 4px;text-align:center;font-size:20px;color:var(--rose)}
  .modal p.hint{margin:0 0 16px;text-align:center;font-size:13px;color:var(--muted)}
  .modal input{
    width:100%;font:inherit;font-size:16px;color:var(--ink);padding:13px 16px;border-radius:16px;
    border:2px solid var(--pink-200);background:var(--pink-50);outline:none;transition:border-color .2s, box-shadow .2s
  }
  .modal input:focus{border-color:var(--pink-400);box-shadow:0 0 0 4px rgba(247,119,163,.2)}
  .visit{margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--pink-50);border:2px dashed var(--pink-200)}
  .visit label.chk{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:15px;user-select:none}
  .visit input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;flex:0 0 auto;
    border-radius:8px;border:2px solid var(--pink-300);background:#fff;cursor:pointer;display:grid;place-content:center;
    padding:0;transition:background .2s,border-color .2s}
  .visit input[type=checkbox]::after{content:"♥";color:#fff;font-size:13px;transform:scale(0);transition:transform .2s}
  .visit input[type=checkbox]:checked{background:var(--pink-500);border-color:var(--pink-500)}
  .visit input[type=checkbox]:checked::after{transform:scale(1)}
  .visit input[type=checkbox]:disabled{opacity:.4;cursor:not-allowed}
  .visit .dateRow{display:none;align-items:center;gap:8px;margin-top:10px}
  .visit.on .dateRow{display:flex}
  .visit .dateRow span{font-size:13px;color:var(--muted);white-space:nowrap}
  .visit .dateRow input{padding:9px 12px;font-size:15px;border-radius:12px;background:#fff}
  .visit .disabledHint{font-size:12px;color:var(--muted);margin:6px 0 0 34px}
  .meta{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px;text-align:right}
  .actions{display:flex;gap:10px;margin-top:16px}
  .btn{
    flex:1;font:inherit;font-size:15px;border:none;border-radius:999px;padding:12px 10px;cursor:pointer;
    transition:transform .12s, filter .2s
  }
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn.primary{background:linear-gradient(135deg,var(--pink-400),var(--pink-500));color:#fff;
    box-shadow:0 8px 16px -8px rgba(232,87,138,.8)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.ghost{background:var(--pink-50);color:var(--pink-500);border:2px solid var(--pink-200)}
  .btn.danger{background:transparent;color:var(--muted);flex:0 0 auto;padding:12px 14px}
  .btn.danger:hover{color:var(--rose)}
  .modal .err{color:var(--rose);font-size:13px;margin-top:10px;text-align:center;min-height:0}

  /* burst */
  .burst{position:fixed;pointer-events:none;z-index:20;color:var(--pink-400);font-size:16px;
    animation:burst .9s ease-out forwards}
  @keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}

  @media (max-width:420px){ .grid{gap:10px} .card{padding:12px} main{padding-top:28px} }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="hearts" id="hearts" aria-hidden="true"></div>

<main>
  <header>
    <p class="script">our little love map</p>
    <h1>我們的愛戀九宮格 <span class="h">💗</span></h1>
    <p class="sub">點一格，寫下想一起去的地方，去過了就打個勾 ♥</p>
  </header>

  <section class="card">
    <div class="grid" id="grid"></div>
  </section>

  <div class="status" id="status"><span class="dot"></span><span id="statusText">正在連線 Google Sheets…</span></div>
  <p class="footer-note">資料同步存放於
    <a href="https://docs.google.com/spreadsheets/d/1JFBx7ozG-KvdvVg3TzdXjUToM0mUHIcfb5wjdshk79s/edit" target="_blank" rel="noopener">「九宮格」試算表</a>
  </p>
</main>

<div class="backdrop" id="backdrop" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <form class="modal" id="form" autocomplete="off">
    <h2 id="mTitle">第 1 格</h2>
    <p class="hint">想和你一起去哪裡呢？</p>
    <input id="placeInput" maxlength="60" placeholder="例如：淡水漁人碼頭看夕陽">
    <div class="visit" id="visitBox">
      <label class="chk"><input type="checkbox" id="visitedInput"> 我們去過了！</label>
      <div class="dateRow">
        <span>日期（選填）</span>
        <input type="date" id="dateInput">
      </div>
      <div class="disabledHint" id="visitHint">先填地點才能打勾喔</div>
    </div>
    <div class="meta" id="meta"></div>
    <div class="err" id="mErr"></div>
    <div class="actions">
      <button type="button" class="btn danger" id="clearBtn" title="清除這格">清除</button>
      <button type="button" class="btn ghost" id="cancelBtn">取消</button>
      <button type="submit" class="btn primary" id="saveBtn">儲存 ♥</button>
    </div>
  </form>
</div>

<script>
(() => {
  const SHEET_ID = "1JFBx7ozG-KvdvVg3TzdXjUToM0mUHIcfb5wjdshk79s";
  const TAB = "九宮格";
  // 網址設定在 config.js
  const SCRIPT_URL = (window.LOVE_GRID_CONFIG && window.LOVE_GRID_CONFIG.SCRIPT_URL) || "";
  const ICONS = ["🌸","🎡","☕","🌅","🍰","🎠","🌙","🏖️","💐"];

  const blank = () => ({place:"", updated:"", visited:false, date:""});
  const state = { cells: Array.from({length:9}, blank), editing:-1, busy:false };
  const $ = id => document.getElementById(id);
  const grid = $("grid");

  /* ---------- background hearts ---------- */
  (function hearts(){
    const box = $("hearts"); const glyphs = ["♥","♡","❤","💕"];
    for (let i=0;i<18;i++){
      const s = document.createElement("span");
      s.textContent = glyphs[i % glyphs.length];
      s.style.left = Math.random()*100 + "vw";
      s.style.fontSize = (12 + Math.random()*22) + "px";
      s.style.animationDuration = (9 + Math.random()*10) + "s";
      s.style.animationDelay = (-Math.random()*18) + "s";
      box.appendChild(s);
    }
  })();

  /* ---------- render ---------- */
  function render(){
    grid.innerHTML = "";
    state.cells.forEach((c, i) => {
      const b = document.createElement("button");
      b.className = "cell " + (c.place ? "filled" : "empty") + (c.place && c.visited ? " visited" : "");
      b.type = "button";
      b.dataset.i = i;
      const v = c.place && c.visited;
      b.setAttribute("aria-label", c.place
        ? `第 ${i+1} 格：${c.place}${v ? "，已去過" + (c.date ? "（" + c.date + "）" : "") : ""}，點擊修改`
        : `第 ${i+1} 格，尚未填寫，點擊新增`);
      b.innerHTML = `<span class="num">${i+1}</span>
        ${v ? '<span class="stamp" aria-hidden="true">✓</span>' : ""}
        <span class="icon">${c.place ? ICONS[i] : "+"}</span>
        <span class="place"></span>
        ${v && c.date ? '<span class="date"></span>' : ""}`;
      b.querySelector(".place").textContent = c.place || "點我填地點";
      if (v && c.date) b.querySelector(".date").textContent = c.date.replace(/-/g, "/");
      b.addEventListener("click", () => openModal(i));
      grid.appendChild(b);
    });
  }

  function setStatus(text, kind, action){
    const el = $("status");
    el.className = "status" + (kind ? " " + kind : "");
    $("statusText").textContent = text;
    const old = el.querySelector(".linkbtn"); if (old) old.remove();
    if (action){
      const a = document.createElement("button");
      a.className = "linkbtn"; a.type = "button"; a.textContent = action.label;
      a.addEventListener("click", action.fn);
      el.appendChild(a);
    }
  }

  function summary(){
    const filled = state.cells.filter(c => c.place).length;
    const visited = state.cells.filter(c => c.place && c.visited).length;
    return `填了 ${filled}/9 格 · 去過 ${visited} 個 💕`;
  }

  function nowStr(){
    const d = new Date(), p = n => String(n).padStart(2,"0");
    return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  /* ---------- sheet I/O (Google Apps Script) ---------- */
  async function load(){
    if (!SCRIPT_URL || SCRIPT_URL.startsWith("貼上")){
      setStatus("尚未設定 SCRIPT_URL：請把 Apps Script 網址填進 config.js", "err"); return;
    }
    setStatus("讀取中…");
    try{
      const r = await fetch(SCRIPT_URL + "?action=list&t=" + Date.now());
      const data = await r.json();
      if (!data.ok) throw new Error(data.error || "讀取失敗");
      const cells = Array.from({length:9}, blank);
      (data.cells || []).forEach((c, idx) => { if (idx < 9) cells[idx] = {
        place: c.place || "", updated: c.updated || "", visited: !!c.visited, date: c.date || "" }; });
      state.cells = cells;
      render();
      setStatus(`已同步 · ${summary()}`, "ok", { label:"重新整理", fn: load });
    }catch(e){
      setStatus("讀取 Google Sheets 失敗：" + (e.message || e), "err", { label:"再試一次", fn: load });
    }
  }

  async function save(i, place, visited, date){
    // text/plain 避免 CORS 預檢，Apps Script 直接接受
    const r = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "save", index: i + 1, place, visited, date })
    });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || "儲存失敗");
    state.cells[i] = { place: data.place, updated: data.updated, visited: !!data.visited, date: data.date || "" };
  }

  /* ---------- modal ---------- */
  const backdrop = $("backdrop"), input = $("placeInput");
  const visitedInput = $("visitedInput"), dateInput = $("dateInput"), visitBox = $("visitBox");
  function syncVisitUI(){
    const hasPlace = !!input.value.trim();
    visitedInput.disabled = state.busy || !hasPlace;
    if (!hasPlace) visitedInput.checked = false;
    $("visitHint").style.display = hasPlace ? "none" : "";
    visitBox.classList.toggle("on", visitedInput.checked);
  }
  input.addEventListener("input", syncVisitUI);
  visitedInput.addEventListener("change", () => {
    if (visitedInput.checked && !dateInput.value){
      const d = new Date(), p = n => String(n).padStart(2,"0");
      dateInput.value = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
    }
    syncVisitUI();
  });
  function openModal(i){
    if (!SCRIPT_URL || SCRIPT_URL.startsWith("貼上")){ setStatus("尚未設定 SCRIPT_URL，無法儲存", "err"); return; }
    state.editing = i;
    const c = state.cells[i];
    $("mTitle").textContent = `第 ${i+1} 格 ${ICONS[i]}`;
    input.value = c.place;
    visitedInput.checked = !!(c.place && c.visited);
    dateInput.value = c.date || "";
    $("meta").textContent = c.updated ? `上次更新：${c.updated}` : "";
    $("mErr").textContent = "";
    $("clearBtn").style.display = c.place ? "" : "none";
    setBusy(false);
    syncVisitUI();
    backdrop.classList.add("open");
    setTimeout(() => input.focus(), 50);
  }
  function closeModal(){ backdrop.classList.remove("open"); state.editing = -1; }
  function setBusy(b){
    state.busy = b;
    ["saveBtn","cancelBtn","clearBtn"].forEach(id => $(id).disabled = b);
    input.disabled = b; dateInput.disabled = b; visitedInput.disabled = b || !input.value.trim();
    $("saveBtn").textContent = b ? "儲存中…" : "儲存 ♥";
  }

  async function commit(value, visited, date){
    const i = state.editing; if (i < 0 || state.busy) return;
    if (!value){ visited = false; date = ""; }
    if (!visited) date = "";
    const cur = state.cells[i];
    if (value === cur.place && visited === !!cur.visited && date === (cur.date || "")){ closeModal(); return; }
    const newlyVisited = visited && !cur.visited;
    setBusy(true);
    const cellEl = grid.children[i]; cellEl && cellEl.classList.add("saving");
    try{
      await save(i, value, visited, date);
      closeModal(); render();
      const el = grid.children[i];
      if (value){ el.classList.add("pop"); burst(el, newlyVisited); }
      setStatus(`已儲存到 Google Sheets · ${summary()}`, "ok", { label:"重新整理", fn: load });
    }catch(e){
      cellEl && cellEl.classList.remove("saving");
      setBusy(false);
      $("mErr").textContent = "儲存失敗：" + (e.message || e) + "（可關閉後按「重新整理」確認）";
    }
  }

  $("form").addEventListener("submit", ev => { ev.preventDefault(); commit(input.value.trim(), visitedInput.checked, dateInput.value); });
  $("clearBtn").addEventListener("click", () => commit("", false, ""));
  $("cancelBtn").addEventListener("click", closeModal);
  backdrop.addEventListener("click", ev => { if (ev.target === backdrop && !state.busy) closeModal(); });
  document.addEventListener("keydown", ev => { if (ev.key === "Escape" && backdrop.classList.contains("open") && !state.busy) closeModal(); });

  function burst(el, big){
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    const n = big ? 18 : 10;
    for (let k=0;k<n;k++){
      const s = document.createElement("span");
      s.className = "burst"; s.textContent = big ? (k%3 ? "♥" : "💕") : (k%2 ? "♥" : "✦");
      const a = (Math.PI*2*k)/n, d = (big ? 70 : 50) + Math.random()*30;
      s.style.left = cx + "px"; s.style.top = cy + "px";
      s.style.setProperty("--dx", Math.cos(a)*d + "px");
      s.style.setProperty("--dy", Math.sin(a)*d + "px");
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 950);
    }
  }

  /* ---------- boot ---------- */
  render();
  load();
})();
</script>
</body>
</html>
